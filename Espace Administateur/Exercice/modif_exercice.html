<body>
    
    <main>
        <div class="formulaire_creation">
            <div class="form_header">
                <h2><i class="fa-solid fa-clipboard"></i> Modifier un exercice</h2>
                <a href="../Exercice/Exercice.html"><i class="fa-solid fa-arrow-left"></i> Retour à la liste</a>
            </div>
            <form action="" class="form" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Titre de l'exercice *</label>
                    <input type="text" name="" required>
                </div>

                <div class="form-group">
                    <label>Cours *</label>
                    <input type="text">
                </div>

            
                <div class="form-group">
                    <label>Fichier </label>
                    <input type="file" name="" accept="image/*">
                </div>
                <p>NB : Formats acceptés : pdf, docx, txt</p>

                <div class="form-row">    
                    <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Enregistrer l'exercice</button>
                    <button type="reset"><i class="fa-solid fa-rotate-left"></i> Réinitialiser</button>
                </div>

            </form>
            
        </div>        
    
    </main>
