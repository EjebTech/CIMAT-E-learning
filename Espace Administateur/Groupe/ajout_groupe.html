<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Ajouter un Groupe - Groupe Komptech Cimat</title>
    <link rel="stylesheet" href="../../Elements/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="formulaire_creation">
            <div class="form_header">
                <h2><i class="fa-solid fa-users-gear"></i> Créer un nouveau groupe</h2>
                <a href="../Groupe/liste_groupes.html"><i class="fa-solid fa-arrow-left"></i> Retour à la liste</a>
            </div>

            <form action="" class="form" method="post">
                <div class="form-group">
                    <label>Nom du groupe *</label>
                    <input type="text" name="nom_groupe" placeholder="Ex: Groupe Web 2026" required>
                </div>

                <div class="form-group">
                    <label>Formation associée *</label>
                    <select name="formation_id" required>
                        <option value="">-- Sélectionnez une formation --</option>
                        <option value="1">Billetterie</option>
                        <option value="2">Anglais</option>
                        <option value="3">Informatique</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description du groupe</label>
                    <input type="text" name="description_groupe" placeholder="">
                </div>

                <div class="form-row">    
                    <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Enregistrer le groupe</button>
                    <button type="reset"><i class="fa-solid fa-rotate-left"></i> Réinitialiser</button>
                </div>
            </form>
        </div>
    </main>

   <footer>
        <p>Crée par <a href="https://cimat-ci.net/">@CIMAT IATA </a> | 2026 Tous droits réservés.</p>
        <div class="reseau_social">
            <a href=""><i class="fa-brands fa-facebook-f"></i></a>
            <a href=""><i class="fa-brands fa-youtube"></i></a>
            <a href=""><i class="fa-brands fa-linkedin"></i></a>
        </div>
    </footer>
</body>
</html>
